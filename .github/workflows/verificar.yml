name: Verificar

# Roda em todo push no master e em toda PR. O objetivo é simples: impedir que
# código que não compila chegue em produção. Antes disto, nada era verificado
# automaticamente — o deploy da Vercel era a primeira vez que alguém descobria
# que algo quebrou.
on:
  push:
    branches: [master]
  pull_request:

# uma PR com vários pushes seguidos cancela as execuções antigas em vez de
# enfileirar
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      # O build precisa dessas duas variáveis mas NUNCA se conecta com elas.
      # Motivo: lib/pautas-db.ts monta o SELECT_BASE no escopo do módulo, e o
      # Next avalia o módulo pra coletar dados das rotas — aí lib/db.ts exige
      # a URL. Valores falsos que apenas parseiam já resolvem.
      # Não são segredos: não dão acesso a nada.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-somente-para-build-nao-assina-nada-real

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # A Vercel roda Node 22+. Manter igual aqui pra o CI não passar
          # em algo que quebraria lá.
          node-version: 22
          cache: npm

      # ci em vez de install: respeita o package-lock exatamente e falha se
      # ele estiver fora de sincronia com o package.json
      - run: npm ci

      # tsc primeiro: é o mais rápido e pega a maior parte dos erros.
      # O union StatusPauta é usado em Record<>, então esquecer um status
      # novo em qualquer tela estoura aqui.
      - name: Checagem de tipos
        run: npx tsc --noEmit

      # O projeto tem 5 erros de lint pré-existentes (setState dentro de
      # efeito). Falhar por eles bloquearia tudo, então o CI só falha se o
      # número AUMENTAR — assim ninguém adiciona erro novo sem perceber, e
      # quem quiser abaixar o teto é só editar o número aqui.
      #
      # Formato json e não unix: o formatador unix saiu do core no ESLint 9.
      - name: Lint (não pode piorar)
        run: node scripts/lint-teto.mjs

      - name: Build de produção
        run: npm run build
